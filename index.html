*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:18px;line-height:1.35}

main{padding:12px 12px 24px}
.tab{display:none}.tab.on{display:block}
h2{margin:6px 0 10px;font-size:22px}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
#admob-banner-placeholder{height:50px;background:var(--soft);color:#8a949e;font-size:12px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--bd)}
nav{display:grid;grid-template-columns:repeat(3,1fr)}

.addrow{display:flex;gap:8px;margin-bottom:10px}
.addrow input{flex:1}
.btn{background:var(--g);color:#fff}
.btn.ghost{background:var(--card);color:var(--g);border:2px solid var(--g)}
.btn.big{width:100%;min-height:60px;font-size:20px}

.addrow .btn{min-width:56px;font-size:26px;padding:0}
.quick{display:flex;gap:8px;margin-bottom:12px}
.quick .btn{flex:1;font-size:16px}
.item{display:flex;gap:10px;background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.item.done{background:var(--done);border-color:var(--doneb)}
.chk{display:block;position:relative;width:44px;height:44px;flex:none;margin-top:2px}
.chk input{position:absolute;opacity:0;inset:0;width:100%;height:100%;min-height:0;margin:0;z-index:2}

.im{flex:1;min-width:0}
.nm{font-weight:800;font-size:20px;word-break:break-word;margin-bottom:6px}
.done .nm{text-decoration:line-through;color:var(--mu)}
.row{display:grid;grid-template-columns:1.1fr 1fr;gap:8px}
.fld small{display:block;font-size:12px;font-weight:700;color:var(--mu);margin-bottom:2px}
.step{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}
.step button{min-height:52px;padding:0;font-size:26px;background:var(--gl);color:var(--g)}
.step input{text-align:center;padding:0}
.line{margin-top:6px;font-size:16px}

.empty{text-align:center;color:var(--mu);padding:30px 10px}
.empty div{font-size:50px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}
.chip{background:var(--card);border:2px solid var(--bd);color:var(--tx);flex:none;font-size:15px;min-height:48px}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.o{background:var(--card);border:3px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.o.win{background:#e3f5ea;border-color:var(--g)}
.o.lose{background:var(--card)}
.oh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.oh .let{background:var(--tx);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none}
.oh input{min-height:44px;font-size:17px}
.oh .rm{background:var(--card);color:var(--r);border:2px solid var(--bd);padding:0;width:44px;min-height:44px;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
details{margin-top:6px}summary{font-weight:700;color:var(--g);min-height:40px;display:flex;align-items:center}
.ppu{margin-top:8px;font-size:18px}
.ppu b{font-size:24px}
.wtag{color:var(--gd);font-weight:900;margin-top:2px}.ltag{color:var(--r);font-weight:700;font-size:15px}
.tag{font-size:13px;background:var(--yl);border-radius:8px;padding:2px 6px;font-weight:700}
.sum{border-radius:16px;padding:14px;margin:6px 0 10px;font-size:19px}
.sum.win{background:var(--gl);border:2px solid var(--g)}
.sum.neu{background:var(--card);border:2px dashed var(--bd);color:var(--mu);font-size:16px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.big-n{font-size:34px;font-weight:900;color:var(--g)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:16px}
.kv:last-child{border:0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:12px 12px calc(env(safe-area-inset-bottom) + 16px)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head b{font-size:21px}
.sheet-head button{background:var(--card);border:2px solid var(--bd);width:48px;padding:0;font-size:22px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px}
.tpl button{background:var(--g);color:#fff;min-height:46px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:170px;background:#111;color:#fff;padding:12px 18px;border-radius:24px;z-index:80;font-weight:700;font-size:16px;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
.cardimg{width:100%;border-radius:14px;border:2px solid var(--bd);margin-bottom:10px}
.aisle{font-weight:900;font-size:17px;margin:14px 2px 6px;color:var(--gd)}
.hint{font-size:14px;color:var(--mu);margin-bottom:6px}.hint:empty{display:none}
.hint .use{min-height:34px;padding:0 12px;background:var(--gl);color:var(--g);border-radius:10px;font-size:14px;margin-left:6px}
.ppl{font-size:14px}
#tab-list.mk .quick{display:none}
#tab-list.mk .nm{font-size:22px}
#toast{display:flex;align-items:center;justify-content:center}
#toast .tbtn{margin-left:12px;min-height:34px;background:#fff;color:#111;border-radius:16px;padding:0 14px}
.pk{margin:4px 0}
.quick .btn{font-size:15px;padding:0 6px}
.nrow{display:flex;gap:10px;align-items:center;background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:8px;margin-bottom:8px}
.nimg{width:64px;height:84px;object-fit:cover;border-radius:8px;background:var(--soft);flex:none}
.ninfo{flex:1;min-width:0}
.nrow .del{width:48px;min-height:48px;padding:0;background:var(--card);border:2px solid var(--bd);color:var(--r);font-size:22px}
.chk{margin-top:4px}
.item{padding:10px}
.item .nm{margin:0 0 2px}
.ctl{display:flex;align-items:center;gap:8px}
.sumline{flex:1;min-width:0;font-size:15px;color:var(--mu)}
.sumline b{font-size:16px;color:var(--tx);display:block;white-space:nowrap}.sumline{white-space:nowrap}
.step.sm{width:132px;flex:none;grid-template-columns:40px 1fr 40px}
.step.sm button,.step.sm input{min-height:44px;font-size:20px;padding:0}
.more{background:var(--soft);color:var(--mu);width:44px;padding:0;min-height:44px;font-size:22px;flex:none;border:2px solid var(--bd)}
.more.on{background:var(--gl);color:var(--g)}
.ext{margin-top:8px}
.ext .fld{margin-bottom:6px}
#vzTxt{width:100%;font:inherit;font-size:19px;border:2px solid var(--bd);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);margin:10px 0;min-height:90px}
.vzprev{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.vzchip{background:var(--gl);color:var(--gd);border-radius:16px;padding:6px 12px;font-weight:700;font-size:16px}
#vzMic.on{background:var(--r);color:#fff}

:root{--hero1:#0a6b34;--hero2:#12a150;--shadow:0 1px 2px rgba(16,20,24,.06),0 6px 18px rgba(16,20,24,.06);--navh:70px}

.hbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-weight:800;font-size:15px;letter-spacing:.2px;opacity:.95}
#themeBtn{background:rgba(255,255,255,.18);border:0;color:#fff;width:38px;min-height:34px;border-radius:12px}
.stats{grid-template-columns:1.25fr 1fr 1fr;gap:10px;align-items:end}
.st small{color:rgba(255,255,255,.78);font-size:11px;letter-spacing:.4px}
.st b{font-size:26px;font-weight:800;color:#fff}
.st.sv b{color:#c8ffd9;font-size:20px}
.st input{background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.35);color:#fff;min-height:36px;font-size:17px;border-radius:12px}
.st input::placeholder{color:rgba(255,255,255,.7)}
.bar{height:8px;background:rgba(255,255,255,.22);margin-top:10px}
.bar i{background:#fff}.bar i.y{background:#ffd666}.bar i.r{background:#ff8a8f}
.barTxt{color:#fff!important;font-size:13px;font-weight:600;margin-top:5px;opacity:.95}
main{padding:12px 14px 24px}
h2{font-size:20px;letter-spacing:-.2px}
.addrow{gap:8px;margin-bottom:10px}
.addrow input{background:var(--card);box-shadow:var(--shadow);border-color:transparent}
.addrow .btn{border-radius:50%;width:48px;min-width:48px;height:48px;min-height:48px;font-size:24px;box-shadow:var(--shadow)}
#micBtn{background:var(--g)!important;color:#fff!important;border:0!important}
[data-theme=dark] #micBtn{color:#04210f!important}
.quick{display:flex;gap:8px;overflow-x:auto;margin-bottom:8px;scrollbar-width:none}
.quick::-webkit-scrollbar,.chips::-webkit-scrollbar,.sugg::-webkit-scrollbar{display:none}
.quick .btn,.chip{flex:none;min-height:38px;font-size:14px;padding:0 14px;border-radius:20px;background:var(--card);border:1.5px solid var(--bd);color:var(--tx);font-weight:700;box-shadow:none}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
[data-theme=dark] .chip.on{color:#04210f}
.chips{gap:8px;margin-bottom:8px;scrollbar-width:none}
.sugg{display:flex;gap:8px;overflow-x:auto;margin:2px 0 10px;align-items:center;scrollbar-width:none}
.sugg small{flex:none;font-weight:800;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.sg{flex:none;min-height:36px;padding:0 12px;border-radius:18px;background:var(--gl);color:var(--gd);font-size:14px;border:1.5px dashed var(--g)}
.aisle{margin:16px 2px 8px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mu)}
.item{display:block;position:relative;border:0;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow);background:var(--card);transition:opacity .2s,transform .15s}
.item.done{background:var(--card);opacity:.62}
.item.done .nm{text-decoration:line-through}
.irow{display:flex;align-items:center;gap:10px}
.chk{width:30px;height:30px;margin:0;flex:none}
.chk span{border-width:2px;border-radius:50%}
.chk input:checked+span::after{font-size:18px}
.ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.nm{flex:1;min-width:0;font-size:17px;font-weight:700;margin:0;line-height:1.25}
.more{width:38px;min-height:38px;border:0;background:transparent;color:var(--mu);font-size:20px}
.ctl{margin-top:8px;padding-left:80px;gap:10px}
.sumline{font-size:13px}
.sumline b{font-size:17px}
.step.sm{width:118px;grid-template-columns:36px 1fr 36px;gap:2px;background:var(--soft);border-radius:14px;padding:2px}
.step.sm button{min-height:38px;background:transparent;font-size:22px}
.step.sm input{min-height:38px;border:0;background:transparent;font-size:17px;font-weight:700}
.badge{margin:8px 0 0 80px;font-size:13px}
.ext{margin:10px 0 0 0;padding-top:10px;border-top:1px dashed var(--bd)}
.card{border:0;box-shadow:var(--shadow);border-radius:18px}
.o{border-width:2px;border-radius:18px;box-shadow:var(--shadow)}
.sum{border-radius:18px}
nav{grid-template-columns:repeat(3,1fr);padding:6px 10px 4px;gap:6px}
#bottom{border:0;box-shadow:0 -6px 24px rgba(0,0,0,.10);border-radius:20px 20px 0 0;background:var(--card)}

#toast{bottom:calc(var(--navh) + 84px)}
.empty{padding:34px 12px}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.pn .kp{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.pn .kp small{display:block;font-size:11px;font-weight:800;color:var(--mu);text-transform:uppercase;letter-spacing:.4px}
.pn .kp b{display:block;font-size:24px;font-weight:800;margin-top:2px}
.pn .kp span{font-size:12px;color:var(--mu)}
.up{color:var(--r)}.dn{color:var(--g)}
.wk{display:flex;align-items:flex-end;gap:8px;height:92px;margin-top:8px}

.hb b{flex:0 0 72px;text-align:right;font-size:13px}

.grade .gl{width:64px;height:64px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;color:#fff;flex:none}
.g-A{background:#12a150}.g-B{background:#7bb12a}.g-C{background:#e0a100}.g-D{background:#e56a1a}.g-E{background:#d4232b}
.grade p{margin:0;font-size:14px;color:var(--mu)}.grade b{font-size:17px}
</style>
</head>
<body>

<header id="top">
  <div class="hbar"><div class="brand">🛒 Qual Compensa?</div><button id="themeBtn" aria-label="Alternar tema claro/escuro">🌙</button></div>
  <div class="stats">
    <div class="st"><small>No carrinho</small><b id="tTotal">R$ 0,00</b></div>
    <div class="st"><small>Meta (R$)</small><input id="goal" inputmode="decimal" placeholder="definir" aria-label="Meta de gasto"></div>
    <div class="st sv"><small>Economizado</small><b id="tSaved">R$ 0,00</b></div>
  </div>
  <div class="bar"><i id="barFill"></i></div>
  <div class="barTxt" id="barTxt"></div>
</header>

<main>
  <section class="tab on" id="tab-list">
    <div class="addrow">
      <input id="newItem" placeholder="Adicionar item (ex.: arroz)" autocomplete="off" enterkeyhint="done">
      <button class="btn ghost" id="micBtn" aria-label="Falar a lista">🎤</button><button class="btn" id="addBtn" aria-label="Adicionar">+</button>
    </div>
    <div class="quick">
      <button class="btn ghost" id="tplBtn">📋 Listas Prontas</button>
      <button class="btn ghost" id="clearChecked">✔ Desmarcar</button><button class="btn ghost" id="sendList">📤 Enviar</button>
    </div>
    <div id="mkBar"></div>

<script>
/* ===== Flag de monetização (Freemium) ===== */
let isProUser = false; // true = remove anúncios e libera exportação do histórico

/*PURE_START*/
function parseNum(v){
  var s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');
  if(!s) return 0;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s);
  return isFinite(n)?n:0;
}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,' ').trim();}
var CATS={
  peso:{label:'Peso',icon:'⚖️',unit:'kg',units:['g','kg'],def:'g'},
  volume:{label:'Volume',icon:'🧴',unit:'L',units:['ml','L'],def:'ml'},
  papel:{label:'Papel/Rolos',icon:'🧻',unit:'100 m',units:[],def:''},
  unid:{label:'Unidades',icon:'📦',unit:'un',units:[],def:''}
};
function calcOpt(cat,o){
  var price=parseNum(o.price), qty=parseNum(o.qty), amount=0;
  if(cat==='peso') amount=qty*(o.unit==='kg'?1:0.001);
  else if(cat==='volume') amount=qty*(o.unit==='L'?1:0.001);
  else if(cat==='papel') amount=parseNum(o.rolos)*parseNum(o.metros);
  else amount=qty;
  if(!(price>0)||!(amount>0)) return null;
  var pp=parseNum(o.promoPrice), pq=parseNum(o.promoQty), eff=price, promo=false;
  if(pp>0&&pq>1&&pp<price){eff=pp;promo=true;}
  var div=cat==='papel'?amount/100:amount;
  return {ppu:eff/div,eff:eff,promo:promo,promoQty:pq,amount:amount,div:div,unitLabel:CATS[cat].unit,packPrice:price};
}
function compare(cat,opts){
  var res=[];
  opts.forEach(function(o,i){var c=calcOpt(cat,o);if(c)res.push({i:i,c:c});});
  if(res.length<2) return {ready:false,res:res};
  res.sort(function(a,b){return a.c.ppu-b.c.ppu;});
  var w=res[0], r=res[1], diff=r.c.ppu-w.c.ppu, tie=diff<0.005;
  return {ready:true,tie:tie,winner:w,runner:r,res:res,saving:tie?0:diff*w.c.div,pct:tie?0:diff/r.c.ppu*100};
}
function histBadge(item,hist){
  var h=hist[norm(item.name)], p=parseNum(item.price);
  if(!h||!(p>0)) return null;
  var ppu=item.ppu||p, unit=item.ppuUnit||'un';
  if(h.unit!==unit) return null;
  var d=ppu-h.ppu;
  if(Math.abs(d)<0.005) return null;
  if(d<0) return {t:'ok',msg:'✅ Mais barato que antes'};
  var shr=item.pack&&h.pack&&item.pack<h.pack-1e-9;
  return {t:'bad',msg:'⚠️ Acima do seu último preço'+(shr?' • embalagem menor (reduflação?)':'')};
}
function packPPU(price,qty,unit){
  var p=parseNum(price),q=parseNum(qty);
  if(!(p>0)||!(q>0)) return null;
  var a=q,u='un';
  if(unit==='g'){a=q/1000;u='kg';}else if(unit==='kg'){u='kg';}else if(unit==='ml'){a=q/1000;u='L';}else if(unit==='L'){u='L';}
  return {ppu:p/a,unit:u,amount:a};
}
var AISLES=[
 ['🥬 Hortifruti',/tomate|cebola|alface|batata|banana|maca|laranja|limao|cenoura|fruta|verdura|legume|alho|mamao|abacaxi|pimentao|abobora|couve/],
 ['🥩 Açougue e Frios',/carne|frango|linguica|peixe|bacon|presunto|mortadela|queijo|salsicha|hamburguer|costela|picanha|peito|coxa|file/],
 ['🥛 Laticínios e Ovos',/leite|iogurte|manteiga|margarina|requeij|ovo|nata/],
 ['🧴 Limpeza',/sabao|amaciante|detergente|desinfetante|agua sanitaria|esponja|saco de lixo|limpador|multiuso|papel toalha|cloro|vassoura|rodo|lustra/],
 ['🧼 Higiene',/papel higi|sabonete|shampoo|condicionador|creme dental|escova|desodorante|fralda|absorvente|cotonete|fio dental/],
 ['🥤 Bebidas',/refrigerante|cerveja|suco|agua mineral|agua com gas|agua de coco|vinho|gelo|energetico/],
 ['🛒 Mercearia',/arroz|feij|acucar|cafe|oleo|macarr|farinha|\bsal\b|molho|biscoito|\bpao\b|pao de|farofa|carvao|bolacha|cereal|aveia|milho|ervilha|azeite|vinagre|tempero|massa|sal grosso/]
];
var AISLE_NAMES=AISLES.map(function(a){return a[0];}).concat(['📦 Outros']);
function aisleOf(name){var n=norm(name);for(var i=0;i<AISLES.length;i++){if(AISLES[i][1].test(n))return i;}return AISLES.length;}
function monthKey(ts){var d=new Date(ts);return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
var MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
function monthLabel(k){var p=k.split('-');return MESES[+p[1]-1]+' de '+p[0];}
function prevMonth(k){var p=k.split('-'),y=+p[0],m=+p[1]-1;if(m<1){m=12;y--;}return y+'-'+('0'+m).slice(-2);}
function reportData(sessions,mk){
  var ss=sessions.filter(function(s){return monthKey(s.ts)===mk;});
  var r={mk:mk,est:0,n:ss.length,total:0,saved:0,weeks:[0,0,0,0,0],aisles:{},items:{},comItens:0,semItens:0};
  ss.forEach(function(s){
    r.total+=s.total||0;r.saved+=s.saved||0;if(s.est)r.est++;
    var d=new Date(s.ts).getDate();r.weeks[Math.min(4,Math.floor((d-1)/7))]+=s.total||0;
    if(s.items&&s.items.length){
      r.comItens++;
      s.items.forEach(function(i){
        var v=(i.p||0)*(i.q||1),a=(i.a==null)?AISLE_NAMES.length-1:i.a;
        r.aisles[a]=(r.aisles[a]||0)+v;
        var k=norm(i.n),o=r.items[k]||(r.items[k]={name:i.n,total:0,qty:0,a:a});
        o.total+=v;o.qty+=(i.q||1);
      });
    }else r.semItens++;
  });
  r.ticket=r.n?r.total/r.n:0;
  return r;
}
var NUMW={um:1,uma:1,dois:2,duas:2,tres:3,quatro:4,cinco:5,seis:6,sete:7,oito:8,nove:9,dez:10,onze:11,doze:12};
function capFirst(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}
var CONN={de:1,do:1,da:1,dos:1,das:1,com:1,por:1,e:1,ou:1,meio:1,meia:1,a:1,para:1,ate:1,no:1,na:1};
var UNITW={kg:1,g:1,gr:1,grama:1,gramas:1,quilo:1,quilos:1,litro:1,litros:1,l:1,ml:1,mg:1,un:1,unidade:1,unidades:1};
function isQ(w){var n=norm(w);return /^\d+([.,]\d+)?x?$/.test(n)||NUMW[n]!=null;}
/* Ditado sem vírgulas (ex.: teclado do iPhone): corta a frase antes de cada nova quantidade */
function splitQty(chunk){
  var w=chunk.split(/\s+/),out=[],cur=[];
  for(var i=0;i<w.length;i++){
    var t=w[i];
    if(cur.length&&isQ(t)){
      var last=cur[cur.length-1],p=norm(last),nx=w[i+1]?norm(w[i+1]):'',cap=/^[A-ZÀ-Ý]/.test(t);
      if(!CONN[p]&&!isQ(last)&&(!UNITW[nx]||cap)){out.push(cur.join(' '));cur=[];}
    }
    cur.push(t);
  }
  if(cur.length)out.push(cur.join(' '));
  return out;
}
function parseSpoken(t){
  var out=[],fill=/^(comprar|compra|preciso de|preciso|quero|anota|anotar|adicionar|adiciona|lista de compras|lista)\s*:?\s+/i;
  String(t||'').replace(/\n/g,',').split(/\s*[,;]\s*|\s+e\s+|\s+mais\s+/i).forEach(function(c){
    c=c.trim().replace(fill,'');
    splitQty(c).forEach(function(p){
      p=p.trim().replace(/[.!?]+$/,'').replace(fill,'').trim();if(!p)return;
      var q=1,w=p.split(/\s+/),m=p.match(/^(\d+)\s*x?\s+(.+)$/i);
      if(m&&!UNITW[norm(m[2].split(/\s+/)[0])]){q=+m[1]||1;w=m[2].split(/\s+/);}
      else if(w.length>1&&NUMW[norm(w[0])]!=null&&!UNITW[norm(w[1])]){q=NUMW[norm(w[0])];w=w.slice(1);}
      while(w.length>1&&isQ(w[0])&&!UNITW[norm(w[1])])w.shift();
      p=w.join(' ').trim();if(p)out.push({name:capFirst(p),qty:q});
    });
  });
  return out;
}
/* Divide o total da nota entre os itens. fixo = preço digitado/calculado (confiável); os demais são estimativas. Retorna o preço unitário de cada item. */
function ratear(items,total){
  var n=items.length;
  if(!n||!(total>0))return items.map(function(i){return i.p;});
  var fixedSum=0,est=[],kn=[];
  items.forEach(function(i,k){if(i.fixo&&i.p>0)fixedSum+=i.p*i.q;else est.push(k);if(i.p>0)kn.push(i.p);});
  var avg=kn.length?kn.reduce(function(a,b){return a+b;},0)/kn.length:0,rem=total-fixedSum,res=items.map(function(i){return i.p;});
  if(est.length&&rem>0){
    var w=est.map(function(k){var i=items[k];return (i.p>0?i.p:(avg>0?avg:1))*i.q;}),sw=w.reduce(function(a,b){return a+b;},0);
    est.forEach(function(k,j){res[k]=rem*w[j]/sw/items[k].q;});
  }else{
    var s=items.reduce(function(a,i){return a+i.p*i.q;},0);
    if(s>0){res=items.map(function(i){return i.p*total/s;});}
    else{var sq=items.reduce(function(a,i){return a+i.q;},0);res=items.map(function(){return total/sq;});}
  }
  return res;
}
/*PURE_END*/

  Object.keys(S.hist).forEach(function(k){if(!nm[k]){nm[k]=S.hist[k].name;cnt[k]=cnt[k]||1;}});
  var arr=Object.keys(nm).filter(function(k){return !inList[k];}).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,8);

/* ===== Calculadora "Qual Vale a Pena?" ===== */
function blankOpt(cat){return {name:'',price:'',qty:'',unit:CATS[cat].def,rolos:'',metros:'',promoPrice:'',promoQty:''};}
function newCalc(cat){cat=cat||'peso';return {cat:cat,opts:[blankOpt(cat),blankOpt(cat)]};}
function optHTML(cat,o,i){
  var L='ABCDEF'[i],f='';
  if(cat==='peso'||cat==='volume'){
    f='<div class="grid2"><div class="fld"><small>Quantidade</small><input data-i="'+i+'" data-f="qty" inputmode="decimal" placeholder="ex.: 500" value="'+esc(o.qty)+'"></div>'+
      '<div class="fld"><small>Unidade</small><select data-i="'+i+'" data-f="unit">'+CATS[cat].units.map(function(u){return '<option'+(o.unit===u?' selected':'')+'>'+u+'</option>';}).join('')+'</select></div></div>';
  }else if(cat==='papel'){
    f='<div class="grid2"><div class="fld"><small>Rolos</small><input data-i="'+i+'" data-f="rolos" inputmode="decimal" placeholder="ex.: 12" value="'+esc(o.rolos)+'"></div>'+
      '<div class="fld"><small>Metros por rolo</small><input data-i="'+i+'" data-f="metros" inputmode="decimal" placeholder="ex.: 30" value="'+esc(o.metros)+'"></div></div>';
  }else{
    f='<div class="fld" style="margin-bottom:6px"><small>Quantidade de unidades</small><input data-i="'+i+'" data-f="qty" inputmode="decimal" placeholder="ex.: 48" value="'+esc(o.qty)+'"></div>';
  }
  var hasPromo=parseNum(o.promoPrice)>0||parseNum(o.promoQty)>0;
  return '<div class="o" data-i="'+i+'"><div class="oh"><div class="let">'+L+'</div><input data-i="'+i+'" data-f="name" placeholder="Marca/nome (opcional)" value="'+esc(o.name)+'">'+(i>=2?'<button class="rm" data-rm="'+i+'" aria-label="Remover opção">✕</button>':'')+'</div>'+
    '<div class="fld" style="margin-bottom:6px"><small>Preço da embalagem (R$)</small><input data-i="'+i+'" data-f="price" inputmode="decimal" placeholder="0,00" value="'+esc(o.price)+'"></div>'+f+
    '<details'+(hasPromo?' open':'')+'><summary>🏷️ Atacarejo / Leve X Pague Y</summary><div class="grid2"><div class="fld"><small>Preço c/ desconto (cada)</small><input data-i="'+i+'" data-f="promoPrice" inputmode="decimal" placeholder="ex.: 8,50" value="'+esc(o.promoPrice)+'"></div>'+
    '<div class="fld"><small>Levando (qtd)</small><input data-i="'+i+'" data-f="promoQty" inputmode="decimal" placeholder="ex.: 3" value="'+esc(o.promoQty)+'"></div></div></details>'+
    '<div class="ppu"></div></div>';
}
function mountCalc(box,st,applyFn,applyLabel,onChange){
  function draw(){
    box.innerHTML='<div class="chips">'+Object.keys(CATS).map(function(k){return '<button class="chip'+(st.cat===k?' on':'')+'" data-cat="'+k+'">'+CATS[k].icon+' '+CATS[k].label+'</button>';}).join('')+'</div>'+
      st.opts.map(function(o,i){return optHTML(st.cat,o,i);}).join('')+
      (st.opts.length<6?'<button class="btn ghost" style="width:100%;margin-bottom:10px" data-add="1">+ Adicionar Opção '+'ABCDEF'[st.opts.length]+'</button>':'')+
      '<div class="resbox"></div>';
    result();
  }
  function result(){
    var cmp=compare(st.cat,st.opts);
    box.querySelectorAll('.o').forEach(function(card){
      var i=+card.dataset.i,c=calcOpt(st.cat,st.opts[i]),p=$('.ppu',card);
      card.classList.remove('win','lose');
      if(!c){p.innerHTML='<span class="muted">Preencha o preço e a quantidade</span>';return;}
      var h='<b>'+brl(c.ppu)+'</b> / '+c.unitLabel;
      if(c.promo)h+=' <span class="tag">c/ desconto levando '+fmtNum(c.promoQty)+'</span>';
      if(cmp.ready){
        if(cmp.tie){h+='<div class="muted">Empate</div>';}
        else if(cmp.winner.i===i){card.classList.add('win');h+='<div class="wtag">🏆 Mais vantajoso</div>';}
        else{var d=c.ppu-cmp.winner.c.ppu;card.classList.add('lose');h+='<div class="ltag">+'+brl(d)+' por '+c.unitLabel+' ('+Math.round(d/cmp.winner.c.ppu*100)+'% mais caro)</div>';}
      }
      p.innerHTML=h;
    });
    var rb=$('.resbox',box);
    if(!cmp.ready){rb.innerHTML='<div class="sum neu">Preencha preço e quantidade de pelo menos 2 opções para ver qual compensa.</div>';return;}
    var w=cmp.winner,wn=st.opts[w.i].name||('Opção '+'ABCDEF'[w.i]),pack=st.cat==='papel'?fmtNum(w.c.amount)+' m':fmtNum(w.c.amount)+' '+w.c.unitLabel;
    if(cmp.tie)rb.innerHTML='<div class="sum neu">🤝 Empate técnico: o preço por '+w.c.unitLabel+' é praticamente igual.</div><button class="btn big" data-apply="1">'+applyLabel+'</button>';
    else rb.innerHTML='<div class="sum win">🏆 Leve a <b>'+esc(wn)+'</b> ('+pack+')<br>Você economiza <b>'+brl(cmp.saving)+'</b> ('+cmp.pct.toFixed(1).replace('.',',')+'%) em relação à opção seguinte.</div><button class="btn big" data-apply="1">'+applyLabel+'</button>';
  }
  box.addEventListener('input',function(e){
    var t=e.target;if(t.dataset.f===undefined)return;
    st.opts[+t.dataset.i][t.dataset.f]=t.value;result();if(onChange)onChange();
  });
  box.addEventListener('change',function(e){var t=e.target;if(t.tagName==='SELECT'){st.opts[+t.dataset.i][t.dataset.f]=t.value;result();if(onChange)onChange();}});
  box.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.cat){st.cat=b.dataset.cat;st.opts.forEach(function(o){o.unit=CATS[st.cat].def;});draw();}
    else if(b.dataset.add){st.opts.push(blankOpt(st.cat));draw();}
    else if(b.dataset.rm){st.opts.splice(+b.dataset.rm,1);draw();}
    else if(b.dataset.apply){var cmp=compare(st.cat,st.opts);if(cmp.ready)applyFn({c:cmp.winner.c,opt:st.opts[cmp.winner.i],saving:cmp.saving,cat:st.cat});}
    if(onChange&&!b.dataset.apply)onChange();
  });
  draw();
  return {reset:function(){st.opts=[blankOpt(st.cat),blankOpt(st.cat)];draw();if(onChange)onChange();}};
}
function applyToItem(it,info){
  it.price=toStr(info.c.eff);it.checked=true;it.ppu=info.c.ppu;it.ppuUnit=info.c.unitLabel;it.pack=info.c.amount;
  it.savedPer=info.saving;delete it.est;delete it.savedAmt;delete it.packQty;delete it.packUnit;
}

  mountCalc($('#sheetCalc'),newCalc('peso'),function(info){
    applyToItem(it,info);save();closeSheet();renderList();
    toast(info.saving>0?'Economia de '+brl(info.saving*(parseNum(it.qty)||1))+' no cofrinho! 🎉':'Preço lançado na lista');
  },'✅ Jogar Vencedor na Lista');
}
var mainCalc=(S.calcDraft&&S.calcDraft.opts&&CATS[S.calcDraft.cat])?S.calcDraft:newCalc('peso');
var calcCtl=mountCalc($('#calcMain'),mainCalc,function(info){
  var name=(info.opt.name||'').trim()||('Item comparado ('+CATS[info.cat].label+')');
  var ex=S.items.find(function(i){return norm(i.name)===norm(name);});
  if(!ex){addItem(name,1);ex=S.items[S.items.length-1];}
  applyToItem(ex,info);save();renderList();showTab('list');calcCtl.reset();
  toast(info.saving>0?'Economia de '+brl(info.saving)+' no cofrinho! 🎉':'Item adicionado à lista');
},'✅ Jogar Vencedor na Lista',function(){S.calcDraft=mainCalc;save();});
$('#calcReset').onclick=function(){calcCtl.reset();};

/* ===== Finalizar compra + card WhatsApp ===== */
$('#finishBtn').onclick=function(){
  var bought=S.items.filter(function(i){return i.checked;});
  if(!bought.length){toast('Marque o que você pegou no carrinho');return;}
  var known=bought.reduce(function(a,i){return a+parseNum(i.price)*(parseNum(i.qty)||1);},0);
  var anyEst=bought.some(function(i){return i.est||!(parseNum(i.price)>0);});
  confirmBox('🏁 Finalizar compra?','Itens: <b>'+bought.length+'</b><br>Total'+(anyEst?' estimado':'')+': <b>'+(known>0?(anyEst?'~':'')+brl(known):'—')+'</b><br><input id="cfIn" placeholder="Mercado (opcional)" value="'+esc(S.lastLoja||'')+'" style="margin:8px 0"><input id="cfIn2" inputmode="decimal" placeholder="Total da nota (R$)'+(anyEst?'':' — opcional')+'" style="margin-bottom:8px"><span class="muted">Digite só o total da nota: o app divide entre os itens. Depois você pode anexar a foto da nota. Os itens comprados saem da lista.</span>','✅ Finalizar',function(loja,totNota){
    var tn=parseNum(totNota);
    if(!(tn>0)&&!(known>0)){toast('Informe o total da nota');setTimeout(function(){$('#finishBtn').onclick();},300);return;}
    snap();try{localStorage.setItem(KEY+'_bak',JSON.stringify(S));}catch(e){}
    var now=Date.now(),sid=uid(),fixo=bought.map(function(i){return !i.est&&parseNum(i.price)>0;});
    var unit=tn>0?ratear(bought.map(function(i,k){return {p:parseNum(i.price),q:parseNum(i.qty)||1,fixo:fixo[k]};}),tn):bought.map(function(i){return parseNum(i.price);});
    var total=tn>0?tn:known,saved=bought.reduce(function(a,i){return a+itemSaved(i);},0);
    var est=fixo.some(function(f){return !f;})||(tn>0&&Math.abs(tn-known)>0.01);
    var cheap=0,pricey=0;bought.forEach(function(i,k){var hh=S.hist[norm(i.name)],pr=parseNum(i.price);if(fixo[k]&&hh&&hh.price>0&&pr>0){if(pr<hh.price*0.995)cheap++;else if(pr>hh.price*1.005)pricey++;}});
    bought.forEach(function(i,k){if(fixo[k])S.hist[norm(i.name)]={name:i.name,ppu:i.ppu||parseNum(i.price),unit:i.ppuUnit||'un',pack:i.pack||null,price:parseNum(i.price),ts:now};});
    S.lastLoja=String(loja||'').trim();
    S.sessions.unshift({id:sid,ts:now,loja:S.lastLoja,total:total,saved:saved,count:bought.length,goal:parseNum(S.goal),est:est,cheap:cheap,pricey:pricey,items:bought.map(function(i,k){return {n:i.name,p:unit[k],q:parseNum(i.qty)||1,a:aisleOf(i.name)};})});
    S.sessions=S.sessions.slice(0,200);S.savedTotal+=saved;
    S.items=S.items.filter(function(i){return bought.indexOf(i)<0;});
    save();renderList();showCard({total:total,saved:saved,count:bought.length,sid:sid,goal:parseNum(S.goal),cheap:cheap,pricey:pricey});
  });
};
function rr(x,px,py,w,h,r,fill){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();x.fillStyle=fill;x.fill();}
function wrap(x,text,cx,y,maxW,lh){var words=text.split(' '),line='',ly=y;words.forEach(function(w){var t=line?line+' '+w:w;if(x.measureText(t).width>maxW&&line){x.fillText(line,cx,ly);line=w;ly+=lh;}else line=t;});x.fillText(line,cx,ly);return ly;}
function drawCard(d){
  var W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#075c2b');g.addColorStop(1,'#1ec462');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.textAlign='center';x.fillStyle='#fff';x.font='bold 64px sans-serif';x.fillText('🛒 Qual Compensa?',W/2,130);
  rr(x,70,200,W-140,900,56,'#ffffff');
  var d0=new Date().toLocaleDateString('pt-BR');
  x.fillStyle='#5a6570';x.font='600 40px sans-serif';x.fillText('Minha compra de '+d0,W/2,290);
  if(d.saved>0){
    x.fillStyle='#101418';x.font='bold 72px sans-serif';x.fillText('Economizei',W/2,440);
    x.fillStyle='#0b7a3b';x.font='900 150px sans-serif';x.fillText(brl(d.saved),W/2,610);
    x.fillStyle='#101418';x.font='bold 56px sans-serif';
    wrap(x,'hoje comparando embalagens!',W/2,720,W-260,70);
  }else{
    x.fillStyle='#101418';x.font='bold 68px sans-serif';x.fillText('Compra organizada!',W/2,450);
    x.fillStyle='#0b7a3b';x.font='900 130px sans-serif';x.fillText(brl(d.total),W/2,620);
    x.fillStyle='#101418';x.font='bold 52px sans-serif';x.fillText('em '+d.count+(d.count>1?' itens':' item'),W/2,720);
  }
  rr(x,140,850,W-280,170,36,'#e3f5ea');
  x.fillStyle='#075c2b';x.font='bold 46px sans-serif';
  x.fillText('Total: '+brl(d.total)+' • '+d.count+(d.count>1?' itens':' item'),W/2,950);
  x.fillStyle='#fff';x.font='bold 56px sans-serif';x.fillText('Compare e economize no mercado',W/2,1200);
  x.font='600 42px sans-serif';x.fillText('Baixe: Qual Compensa? Lista Mercado',W/2,1270);
  return c;
}
function gradeOf(d){
  var s=60,why=[];
  if(d.goal>0){if(d.total<=d.goal){s+=20;why.push('dentro da meta');}else{s-=20;why.push('acima da meta em '+brl(d.total-d.goal));}}
  var cp=(d.cheap||0)+(d.pricey||0);
  if(cp){s+=20*((d.cheap||0)-(d.pricey||0))/cp;if(d.cheap)why.push(d.cheap+(d.cheap>1?' itens mais baratos':' item mais barato')+' que da última vez');if(d.pricey)why.push(d.pricey+(d.pricey>1?' itens mais caros':' item mais caro')+' que da última vez');}

/* ===== Notas fiscais: fotos guardadas no aparelho (IndexedDB) ===== */
var _db=null;
function dbOpen(){return new Promise(function(res,rej){if(_db)return res(_db);var r=indexedDB.open('qc_notas',1);r.onupgradeneeded=function(){r.result.createObjectStore('img');};r.onsuccess=function(){_db=r.result;res(_db);};r.onerror=function(){rej(r.error);};});}
function dbTx(mode,fn){return dbOpen().then(function(d){return new Promise(function(res,rej){var t=d.transaction('img',mode),st=t.objectStore('img'),rq=fn(st);t.oncomplete=function(){res(rq&&rq.result);};t.onerror=function(){rej(t.error);};});});}
function dbPut(k,v){return dbTx('readwrite',function(s){return s.put(v,k);});}
function dbGet(k){return dbTx('readonly',function(s){return s.get(k);}).catch(function(){return null;});}
function dbDel(k){return dbTx('readwrite',function(s){return s.delete(k);}).catch(function(){});}
function shrinkImage(file,maxSide){
  return new Promise(function(res,rej){
    var img=new Image(),u=URL.createObjectURL(file);
    img.onload=function(){
      var s=Math.min(1,maxSide/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      c.toBlob(function(b){b?res(b):rej(new Error('img'));},'image/jpeg',0.72);
    };
    img.onerror=function(){rej(new Error('img'));};img.src=u;
  });
}

function openNotaForm(sid){

  b.innerHTML='<p class="muted">Tire uma foto da nota ou escolha da galeria.</p><input type="file" id="nfFile" accept="image/*" multiple style="margin-bottom:8px"><div class="grid2"><div class="fld"><small>Valor da nota (R$)</small><input id="nfTot" inputmode="decimal" placeholder="opcional" value="'+(ses?esc(toStr(ses.total)):'')+'"></div><div class="fld"><small>Mercado</small><input id="nfLoja" placeholder="opcional" value="'+esc(ses?(ses.loja||''):(S.lastLoja||''))+'"></div></div><button class="btn big" id="nfSave" style="margin-top:8px">Salvar nota</button>';
  $('#nfSave').onclick=function(){
    var files=$('#nfFile').files;if(!files.length){toast('Escolha uma foto');return;}
    var tot=parseNum($('#nfTot').value),loja=$('#nfLoja').value.trim(),ts=ses?ses.ts:Date.now();
    toast('Salvando…');
    var jobs=[].slice.call(files).map(function(f,idx){
      var id=uid();
      return shrinkImage(f,1600).then(function(bl){return dbPut(id,bl);}).then(function(){S.notes.push({id:id,sid:sid||null,ts:ts,total:idx===0?tot:0,loja:loja});});
    });
    Promise.all(jobs).then(function(){save();toast('Nota guardada');openNotas();}).catch(function(){toast('Não consegui salvar a foto');});
  };
}

/* ===== Relatório mensal (gráficos desenhados em canvas + PDF gerado offline) ===== */
var PDF_REQUIRES_PRO=false; // true = PDF só para Pro
var reportPages=null;
function monthsWithData(){var m={};S.sessions.forEach(function(s){m[monthKey(s.ts)]=1;});return Object.keys(m).sort().reverse();}
function plainName(s){return String(s).replace(/^[^A-Za-zÀ-ÿ0-9]+\s*/,'');}
function loadImg(bl){return new Promise(function(res){var u=URL.createObjectURL(bl),im=new Image();im.onload=function(){res(im);};im.onerror=function(){res(null);};im.src=u;});}
function renderReport(mk){
  var d=reportData(S.sessions,mk),pd=reportData(S.sessions,prevMonth(mk));
  var W=1240,H=1754,M=90,pages=[],cv,x,y,G='#0b7a3b',T='#101418',MU='#5a6570',LN='#d5dbe1',BG='#eef1f4';
  function page(){cv=document.createElement('canvas');cv.width=W;cv.height=H;x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);pages.push(cv);y=M;}
  function txt(s,px,py,size,color,weight,align){x.font=(weight||'400')+' '+size+'px sans-serif';x.fillStyle=color||T;x.textAlign=align||'left';x.textBaseline='alphabetic';x.fillText(s,px,py);}
  function fitText(s,maxW,size,weight){x.font=(weight||'400')+' '+size+'px sans-serif';s=String(s);if(x.measureText(s).width<=maxW)return s;while(s.length>1&&x.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…';}
  function need(hh){if(y+hh>H-M-40)page();}
  function h2(s,keep){need(110+(keep||0));y+=30;txt(s,M,y,40,G,'700');y+=20;x.fillStyle=LN;x.fillRect(M,y,W-2*M,3);y+=44;}
  function money(n){return brl(n);}
  page();
  x.fillStyle=G;x.fillRect(0,0,W,230);
  txt('Qual Compensa?',M,100,58,'#fff','800');
  txt('Relatório de gastos • '+monthLabel(mk),M,160,36,'#fff','500');
  txt('Gerado em '+new Date().toLocaleDateString('pt-BR'),M,205,26,'#d8f3e3','400');
  y=290;
  function kpi(px,py,label,value,sub){x.fillStyle=BG;x.fillRect(px,py,525,140);txt(label,px+24,py+42,26,MU,'600');txt(value,px+24,py+92,44,T,'800');if(sub)txt(sub,px+24,py+126,24,MU,'400');}
  var delta='—',dsub='sem mês anterior';
  if(pd.total>0){var pc=(d.total-pd.total)/pd.total*100;delta=(pc>=0?'+':'')+pc.toFixed(0)+'%';dsub='vs '+monthLabel(prevMonth(mk));}
  kpi(M,y,'TOTAL GASTO',money(d.total),d.n+(d.n===1?' compra':' compras'));
  kpi(M+545,y,'ECONOMIA COM O APP',money(d.saved),'comparando embalagens');
  kpi(M,y+160,'TICKET MÉDIO',money(d.ticket),'por compra');
  kpi(M+545,y+160,'VARIAÇÃO DO GASTO',delta,dsub);
  y+=340;
  var av=(S.notes||[]).filter(function(n){return !n.sid&&monthKey(n.ts)===mk&&n.total>0;}),avT=av.reduce(function(a,n){return a+n.total;},0);
  if(av.length){txt('+ '+money(avT)+' em '+av.length+(av.length>1?' notas avulsas':' nota avulsa')+' (fora da lista, não entram nos gráficos)',M,y,26,MU,'400');y+=30;}
  if(!d.n){txt('Nenhuma compra finalizada neste mês.',M,y+40,32,MU,'400');}
  else{
    h2('Gasto por semana do mês',430);
    need(420);
    var cw=W-2*M,ch=300,base=y+ch,mx=Math.max.apply(null,d.weeks.concat([1])),bw=110,gap=(cw-5*bw)/4;
    d.weeks.forEach(function(v,i){
      var bx=M+i*(bw+gap),bh=v/mx*(ch-50);
      x.fillStyle=v>0?G:'#e4e8ec';x.fillRect(bx,base-Math.max(bh,4),bw,Math.max(bh,4));
      if(v>0)txt(money(v),bx+bw/2,base-bh-12,24,T,'600','center');
      txt('Sem '+(i+1),bx+bw/2,base+38,26,MU,'400','center');
    });
    x.fillStyle=LN;x.fillRect(M,base,cw,3);y=base+66;
    txt('Sem 1 = dias 1 a 7 · Sem 5 = dia 29 em diante',M,y,22,MU,'400');y+=20;
    if(d.comItens){
      var al=Object.keys(d.aisles).map(function(k){return {a:+k,v:d.aisles[k]};}).sort(function(p,q){return q.v-p.v;}),sum=al.reduce(function(a,r){return a+r.v;},0);
      h2('Gasto por seção',200);
      al.forEach(function(r){
        need(64);
        txt(fitText(plainName(AISLE_NAMES[r.a]),300,28),M,y+30,28,T);
        var bwid=Math.max(6,r.v/al[0].v*470);x.fillStyle=G;x.fillRect(M+320,y+6,bwid,36);
        txt(money(r.v)+'  ('+Math.round(r.v/sum*100)+'%)',M+320+bwid+14,y+34,26,T,'600');y+=64;
      });
      var its=Object.keys(d.items).map(function(k){return d.items[k];}).sort(function(p,q){return q.total-p.total;});
      h2('Itens que mais pesaram no bolso',260);
      need(60);txt('Item',M,y,26,MU,'700');txt('Qtd',M+760,y,26,MU,'700','right');txt('Total',W-M,y,26,MU,'700','right');y+=14;x.fillStyle=LN;x.fillRect(M,y,W-2*M,2);y+=36;
      its.slice(0,10).forEach(function(it,i){need(48);txt((i+1)+'. '+fitText(it.name,640,28),M,y,28,T);txt(fmtNum(it.qty),M+760,y,28,T,'400','right');txt(money(it.total),W-M,y,28,T,'700','right');y+=46;});
      h2('Todos os itens por seção',200);
      al.forEach(function(r){
        need(120);
        txt(plainName(AISLE_NAMES[r.a])+' — '+money(r.v),M,y,32,G,'700');y+=44;
        its.filter(function(it){return it.a===r.a;}).forEach(function(it){need(42);txt(fitText(it.name,640,26),M+20,y,26,T);txt(fmtNum(it.qty),M+760,y,26,MU,'400','right');txt(money(it.total),W-M,y,26,T,'400','right');y+=40;});
        y+=24;
      });
    }
    if(d.est){need(80);txt('Em '+d.est+(d.est>1?' compras':' compra')+', os valores por item e por seção são estimados a partir do total da nota.',M,y+20,24,MU,'400');y+=50;}
    if(d.semItens){need(80);txt(d.semItens+(d.semItens>1?' compras':' compra')+' deste mês foram feitas antes do detalhamento por item e entram só nos totais.',M,y+20,24,MU,'400');y+=50;}
  }
  function addNotas(){
    var ns=(S.notes||[]).filter(function(n){return monthKey(n.ts)===mk;}).sort(function(a,b){return a.ts-b.ts;});
    if(!ns.length)return Promise.resolve();
    page();h2('Notas fiscais anexadas ('+ns.length+')');
    var col=0,rowTop=y,cellW=(W-2*M-30)/2,cellH=780,p=Promise.resolve();
    ns.forEach(function(n){
      p=p.then(function(){return dbGet(n.id);}).then(function(bl){return bl?loadImg(bl):null;}).then(function(im){
        if(col===0&&rowTop+cellH+70>H-M-40){page();rowTop=y;}
        var cx=M+col*(cellW+30);
        txt(new Date(n.ts).toLocaleDateString('pt-BR')+(n.loja?' • '+fitText(n.loja,260,24):'')+(n.total>0?' • '+money(n.total):''),cx,rowTop+24,24,MU,'600');
        if(im){var s=Math.min(cellW/im.width,(cellH-50)/im.height),w=im.width*s,hh=im.height*s;x.fillStyle=BG;x.fillRect(cx,rowTop+40,cellW,cellH-50);x.drawImage(im,cx+(cellW-w)/2,rowTop+40+((cellH-50)-hh)/2,w,hh);}
        col++;if(col===2){col=0;rowTop+=cellH+30;y=rowTop;}
      });
    });
    return p;
  }
  return addNotas().then(function(){
    pages.forEach(function(c,i){var g=c.getContext('2d');g.textBaseline='alphabetic';g.font='400 22px sans-serif';g.fillStyle=MU;g.textAlign='right';g.fillText('Página '+(i+1)+' de '+pages.length,W-M,H-45);g.textAlign='left';g.fillText('Qual Compensa? · seus dados ficam só neste aparelho',M,H-45);});
    return pages;
  });
}
function makePDF(pages){
  return Promise.all(pages.map(function(c){
    return new Promise(function(r){c.toBlob(r,'image/jpeg',0.82);}).then(function(b){return b.arrayBuffer();}).then(function(ab){return {w:c.width,h:c.height,d:new Uint8Array(ab)};});
  })).then(function(js){
    var enc=new TextEncoder(),parts=[],offs=[],len=0,n=js.length,kids=[];
    function add(s){var b=typeof s==='string'?enc.encode(s):s;parts.push(b);len+=b.length;}
    add('%PDF-1.4\n%âãÏÓ\n');
    for(var i=0;i<n;i++)kids.push((3+3*i)+' 0 R');
    offs[1]=len;add('1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    offs[2]=len;add('2 0 obj\n<< /Type /Pages /Kids ['+kids.join(' ')+'] /Count '+n+' >>\nendobj\n');
    js.forEach(function(p,i){
      var pid=3+3*i,cid=pid+1,iid=pid+2,c='q 595 0 0 842 0 0 cm /Im0 Do Q';
      offs[pid]=len;add(pid+' 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /XObject << /Im0 '+iid+' 0 R >> >> /Contents '+cid+' 0 R >>\nendobj\n');
      offs[cid]=len;add(cid+' 0 obj\n<< /Length '+c.length+' >>\nstream\n'+c+'\nendstream\nendobj\n');
      offs[iid]=len;add(iid+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+p.w+' /Height '+p.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+p.d.length+' >>\nstream\n');add(p.d);add('\nendstream\nendobj\n');
    });
    var total=3+3*n,xr=len,xs='xref\n0 '+total+'\n0000000000 65535 f \n';
    for(var k=1;k<total;k++)xs+=('0000000000'+offs[k]).slice(-10)+' 00000 n \n';
    add(xs+'trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');
    return new Blob(parts,{type:'application/pdf'});
  });
}
function openRelatorio(mk){
  var months=monthsWithData(),b=openSheet('📄 Relatório mensal');
  if(!months.length){b.innerHTML='<div class="empty"><div>📄</div>Finalize uma compra para ver o relatório do mês.</div>';return;}
  mk=mk||months[0];
  b.innerHTML='<div class="fld"><small>Mês</small><select id="rpMes">'+months.map(function(m){return '<option value="'+m+'"'+(m===mk?' selected':'')+'>'+monthLabel(m)+'</option>';}).join('')+'</select></div><div id="rpPrev" class="muted" style="margin:10px 0">Montando relatório…</div>';
  $('#rpMes').onchange=function(){openRelatorio(this.value);};
  S.lastReportSeen=mk;save();reportPages=null;
  renderReport(mk).then(function(pages){
    var sel=$('#rpMes');if(!sel||sel.value!==mk)return;
    reportPages=pages;
    $('#rpPrev').outerHTML='<div class="row" style="margin:10px 0"><button class="btn big" id="rpPdf">⬇️ Baixar PDF</button><button class="btn ghost big" id="rpShare">📲 Compartilhar</button></div>'+pages.map(function(c){return '<img class="cardimg" alt="Página do relatório" src="'+c.toDataURL('image/jpeg',0.6)+'">';}).join('');
    function go(share){
      if(PDF_REQUIRES_PRO&&!isProUser){toast('O PDF é um recurso Pro (em breve)');return;}
      toast('Gerando PDF…');
      makePDF(reportPages).then(function(bl){
        var name='relatorio-qual-compensa-'+mk+'.pdf',f=null;
        try{f=new File([bl],name,{type:'application/pdf'});}catch(e){}
        if(share&&f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Relatório '+monthLabel(mk)}).catch(function(){});return;}
        var a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('PDF salvo em Downloads');
      }).catch(function(){toast('Não consegui gerar o PDF');});
    }
    $('#rpPdf').onclick=function(){go(false);};$('#rpShare').onclick=function(){go(true);};
  }).catch(function(){var p=$('#rpPrev');if(p)p.textContent='Não consegui montar o relatório.';});
}
/* Aviso automático: no início de cada mês, o relatório do mês anterior é oferecido sozinho */
function checkMonthlyReport(){
  var cur=monthKey(Date.now()),pm=prevMonth(cur),today=new Date().toISOString().slice(0,10);
  if(S.lastReportSeen===pm||S.lastNudge===today)return;
  if(S.sessions.some(function(s){return monthKey(s.ts)===pm;})){
    S.lastNudge=today;save();
    toast('Seu relatório de '+monthLabel(pm)+' está pronto',{label:'Ver',fn:function(){openRelatorio(pm);}});
  }
}

/* ===== Falar a lista (microfone) ===== */
function openVoz(){
  var b=openSheet('🎤 Falar a lista'),listening=false,stopFn=null;
  b.innerHTML='<p class="muted">Toque no microfone e fale os itens. Ex.: "arroz, feijão, 2 leites e ovos".</p><button class="btn big" id="vzMic">🎤 Toque e fale</button><textarea id="vzTxt" rows="3" placeholder="O que você falar aparece aqui. Você também pode digitar ou usar o 🎤 do teclado."></textarea><div id="vzPrev" class="vzprev"></div><button class="btn big" id="vzAdd" style="margin-top:10px">Adicionar à lista</button>';
  var ta=$('#vzTxt'),mic=$('#vzMic'),btn=$('#vzAdd');
  function upd(){
    var it=parseSpoken(ta.value);
    $('#vzPrev').innerHTML=it.map(function(r){return '<span class="vzchip">'+(r.qty>1?r.qty+'× ':'')+esc(r.name)+'</span>';}).join('');
    btn.textContent=it.length?'Adicionar '+it.length+(it.length>1?' itens':' item')+' à lista':'Adicionar à lista';
  }
  function setListening(v){listening=v;mic.classList.toggle('on',v);mic.textContent=v?'⏹ Parar':'🎤 Toque e fale';}
  ta.addEventListener('input',upd);
  btn.onclick=function(){
    var it=parseSpoken(ta.value);if(!it.length){toast('Fale ou digite os itens');return;}
    if(stopFn)stopFn();snap();var n=0;it.forEach(function(r){if(addItem(r.name,r.qty))n++;});
    save();renderList();closeSheet();if(n)undoable(n+(n>1?' itens adicionados':' item adicionado'));else toast('Esses itens já estão na lista');
  };
  mic.onclick=function(){
    if(listening){if(stopFn)stopFn();return;}
    var cap=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.SpeechRecognition,R=window.SpeechRecognition||window.webkitSpeechRecognition;
    var base=ta.value.trim()?ta.value.trim()+', ':'';
    if(cap){ // app empacotado (Capacitor): reconhecimento nativo do Android
      setListening(true);stopFn=function(){try{cap.stop();}catch(e){}setListening(false);};
      Promise.resolve(cap.requestPermissions?cap.requestPermissions():0).then(function(){return cap.start({language:'pt-BR',maxResults:1,prompt:'Fale a lista de compras',popup:true});}).then(function(r){var t=r&&r.matches&&r.matches[0];if(t){ta.value=base+t;upd();}setListening(false);}).catch(function(){setListening(false);toast('Não consegui usar o microfone. Use o 🎤 do teclado.');});
    }else if(R){ // navegador (Chrome): reconhecimento do navegador, precisa de internet
      var rec=new R();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;
      rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++)s+=e.results[i][0].transcript+' ';ta.value=(base+s).trim();upd();};
      rec.onend=function(){setListening(false);stopFn=null;};
      rec.onerror=function(e){setListening(false);toast(e&&e.error==='not-allowed'?'Permita o microfone para falar a lista':'Sem reconhecimento agora. Use o 🎤 do teclado.');};
      stopFn=function(){try{rec.stop();}catch(e){}};
      try{rec.start();setListening(true);}catch(e){toast('Não consegui iniciar o microfone');}
    }else{ta.focus();toast('Toque no 🎤 do teclado do celular e fale a lista');}
  };
  sheetCleanup=function(){if(stopFn){try{stopFn();}catch(e){}}};
}

/* ===== Tema claro/escuro ===== */
function applyTheme(t){document.documentElement.setAttribute('data-theme',t);$('#themeBtn').textContent=t==='dark'?'☀️':'🌙';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==='dark'?'#0d1117':'#0b7a3b';}
var THEME_KEY='qc_theme';
function initTheme(){var t=null;try{t=localStorage.getItem(THEME_KEY);}catch(e){}if(!t)t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';applyTheme(t);}
$('#themeBtn').onclick=function(){var t=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(t);try{localStorage.setItem(THEME_KEY,t);}catch(e){}};
initTheme();

/* ===== Início ===== */
if(isProUser||!adsEnabled)$('#admob-banner-placeholder').classList.add('hidden');
renderList();renderHist();fit();
if(!S.onboarded)onboard();else setTimeout(checkMonthlyReport,1500);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
